services:
  tunnel-origin:
    image: nginx:1.28-alpine
    restart: unless-stopped
    network_mode: "service:tunnel"
    depends_on:
      - tunnel
      - gateway
    volumes:
      - ./tunnel-origin/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tunnel-origin/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./tunnel-origin/key.pem:/etc/nginx/certs/key.pem:ro
