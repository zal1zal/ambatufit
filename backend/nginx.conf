# AmbatuFit STB Nginx Gateway Configuration
# Rate limiting, security headers, Cloudflare real-IP forwarding, reverse proxy to core-service

map $http_cf_connecting_ip $real_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

limit_req_zone $real_client_ip zone=api_limit:10m rate=15r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check for load balancer / Cloudflare / local monitoring
    location = /health {
        default_type application/json;
        return 200 '{"status":"healthy","service":"gateway","timestamp":"$time_iso8601"}';
    }

    # Entry info when Cloudflare forwards /api directly
    location = /api {
        default_type application/json;
        return 200 '{"status":"healthy","service":"ambatufit-gateway","api_base":"/api/v1","health":"/api/health","docs":"/api/docs","openapi":"/api/openapi.json"}';
    }

    # Interactive API documentation & OpenAPI specification through STB Gateway
    location ~ ^/(docs|redoc|openapi\.json)$ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://core-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # API core service routing (includes /api/v1/*, /api/health, /api/docs, /api/redoc, /api/openapi.json)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://core-service:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Timeouts suitable for STB hardware
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # Fallback default
    location / {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Resource not found on AmbatuFit STB Gateway"}}';
    }
}
